"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Cornelius Toole"
email = "197863+corntoole@users.noreply.github.com"

[signing]
behavior = "drop"
backend = "ssh"
## You can set `key` to anything accepted by `gpg -u`
## If not set then defaults to the key associated with `user.email`
#key = "77ACE5D7"
key = "~/.ssh/id_ed25519.pub"

[ui]
revsets-use-glob-by-default = true

[git]
sign-on-push = true
write-change-id-header = true

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'

'user(x)' = 'author(x) | committer(x)'
'mine()' = 'user(exact:"197863+corntoole@users.noreply.github.com") | user(exact:"ctoole@zenoss.com") | user(exact:"cornelius.toole@virtana.com")'

# Private and WIP commits that should never be pushed anywhere. Often part of
# work-in-progress merge stacks.
'wip()' = 'description(glob:"wip:*")'
'private()' = 'description(glob:"private:*")'
'blocklist()' = 'wip() | private()'

# stack(x, n) is the set of mutable commits reachable from 'x', with 'n'
# parents. 'n' is often useful to customize the display and return set for
# certain operations. 'x' can be used to target the set of 'roots' to traverse,
# e.g. @ is the current stack.
'stack()' = 'stack(@)'
'stack(x)' = 'stack(x, 2)'
'stack(x, n)' = 'ancestors(reachable(x, mutable()), n)'

# The current set of "open" works. It is defined as: all stacks that are
# reachable from my working copy, or any other commit I wrote.
# n = 1, meaning that nothing from `trunk()` is included, so all resulting
# commits are mutable by definition.
'open()' = 'stack(mine() | @, 1)'

# the set of 'ready()' commits. defined as the set of open commits, but nothing
# that is blacklisted or any of their children.
#
# often used with gerrit, which you can use to submit whole stacks at once:
#
# - jj gerrit send -r 'ready()' --dry-run
'ready()' = 'open() ~ descendants(blocklist())'
# megamerge-related aliases
# Returns the closest merge commit to `to`
"closest_merge(to)" = "heads(::to & merges())"

# All workspace working-copy commits except the primary integration workspace.
'agent_wcs()' = 'working_copies() ~ default@'

# The commit agent workspaces branch from and the megamerge merges onto.
# Override per repo if you integrate on something other than trunk().
'megamerge_base()' = 'trunk()'

# Agent workspaces with work in progress (empty buffer commits on top of work
# count as active: they are the targets for jj absorb and jj mega-fix).
'active_agents()' = 'agent_wcs() ~ idle_agents()'

# Agent workspace working copies that sit directly on the base with nothing in
# them: candidates for jj mega-prune.
'idle_agents()' = 'agent_wcs() & empty() & megamerge_base()+'

# Locate the mutable megamerge commit by exact description ("megamerge").
'megamerge()' = 'description(exact:"megamerge\n") & mutable()'

# The megamerge commit and the agent heads it merges (everything but the base).
'agents_of_megamerge()' = 'megamerge() | (megamerge()- ~ megamerge_base())'

[aliases]
# via andre.arko.net's JJCon talk, Stupid JJ Tricks
init = ["util", "exec", "--", "bash", "-c", """
jj git init --colocate
# only track origin branches, not upstream or others
jj bookmark track 'glob:*@origin'
"""]

tug = ["util", "exec", "--", "sh", "-c", """
if [ "x$1" = "x" ]; then
  jj bookmark move --from "closest_bookmark(@)" --to "closest_pushable(@)"
else
  jj bookmark move --to "closest_pushable(@)" "$@"
fi
""", ""]

# via @thoughtpolice
# Get all open stacks of work
open = ["log", "-r", "open()"]

# Retrunk revisions. Typically as `jj retrunk -s ...` -- notably can be used
# with open:
# - jj retrunk -s 'roots(open())'
retrunk = ["rebase", "-d", "trunk()"]

# Retrunk the current stack of work.
reheat = ["rebase", "-d", "trunk()", "-s", "roots(trunk()..stack(@))"]

# via andre.arko.net
pr = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
gh pr create --head $(jj log -r 'closest_bookmark(@)' -T 'bookmarks' --no-graph | cut -d ' ' -f 1)
""",
]

pull = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
closest="$(jj log -r 'closest_bookmark(@)' -n 1 -T 'bookmarks' --no-graph | cut -d ' ' -f 1)"
closest="${closest%\\*}"
jj git fetch
jj log -n 1 -r "${closest}" 2>&1 > /dev/null && jj rebase -d "${closest}" || jj rebase -d 'trunk()'
jj log -r 'stack()'
""",
]

push = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
tuggable="$(jj log -r 'closest_bookmark(@)..closest_pushable(@)' -T '"n"' --no-graph)"
[[ -n "$tuggable" ]] && jj tug
pushable="$(jj log -r 'remote_bookmarks(remote=origin)..@' -T 'bookmarks' --no-graph)"
[[ -n "$pushable" ]] && jj git push || echo "Nothing to push."
closest="$(jj log -r 'closest_bookmark(@)' -n 1 -T 'bookmarks' --no-graph | cut -d ' ' -f 1)"
closest="${closest%\\*}"
tracked="$(jj bookmark list -r ${closest} -t -T 'if(remote == "origin", name)')"
[[ "$tracked" == "$closest" ]] || jj bookmark track "${closest}@origin"
""",
]

# megamerge-related aliases
# Inserts the given revset as a new branch under the megamerge.
stack = [
  "rebase",
  "--after",
  "trunk()",
  "--before",
  "closest_merge(@)",
  "--revision",
]
# Stages multiple revsets under the  megamerge.
stage = ["stack", "closest_merge(@)+:: ~ empty()"]
# Rebases writable stacks onto trunk in order to keep the branches under the megamerge up to date.
restack = [
  "rebase",
  "--onto",
  "trunk()",
  "--source",
  "roots(trunk()..) & mutable()",
  "--simplify-parents",
]

# Create a new agent workspace as a sibling of the current one:
#   jj mega-new <name> [base-revset]
mega-new = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj workspace update-stale >/dev/null 2>&1 || true
if [ $# -lt 1 ]; then
  echo "usage: jj mega-new <name> [base-revset]" >&2
  exit 1
fi
name="$1"
shift
base="${1:-megamerge_base()}"
root="$(jj workspace root)"
dir="$(dirname "$root")"
if [ -e "$dir/$name" ]; then
  echo "error: $dir/$name already exists" >&2
  exit 1
fi
jj workspace add -r "$base" "$dir/$name"
echo "Agent workspace '$name' created at $dir/$name."
echo "Start agents there with: cd $dir/$name && jj describe -m '<task>'"
''', ""]

# Push the changes sitting in default@'s working copy into a specific agent
# workspace's commit (line-level fixes to lines that agent touched):
#   jj mega-fix <workspace-name>
mega-fix = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj workspace update-stale >/dev/null 2>&1 || true
if [ $# -lt 1 ]; then
  echo "usage: jj mega-fix <workspace-name>" >&2
  exit 1
fi
ws="$1"
root="$(jj workspace list -T 'name ++ "\t" ++ root ++ "\n"' | awk -F'\t' -v n="$ws" '$1 == n { print $2 }')"
if [ -z "$root" ] || [ ! -d "$root" ]; then
  echo "error: no workspace '$ws' with a directory on disk" >&2
  exit 1
fi
jj -R "$root" workspace update-stale >/dev/null 2>&1 || true
target="$(jj -R "$root" log -r '@' --no-graph -T 'change_id')"
jj squash --into "$target"
echo "Pushed default@ changes into workspace '$ws' ($root)."
echo "The agent should run: jj workspace update-stale"
''', ""]

# Snapshot all agent workspaces, update/create the megamerge, and position
# default@ on top of it.
mega-sync = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj workspace update-stale >/dev/null 2>&1 || true

# Snapshot every agent workspace so disk edits are recorded
# (update-stale also snapshots; a bare status would fail on stale workspaces).
jj workspace list -T 'name ++ "\t" ++ root ++ "\n"' | while IFS=$'\t' read -r name root; do
  if [ "$name" != "default" ] && [ -d "$root" ]; then
    jj -R "$root" workspace update-stale >/dev/null 2>&1 || true
  fi
done

# Rebase or create the megamerge commit across all active agent heads + base
if [ -n "$(jj log -r 'megamerge()' --no-graph -T 'commit_id')" ]; then
  jj rebase -r 'megamerge()' -d 'active_agents() | megamerge_base()' --simplify-parents
else
  jj new 'active_agents() | megamerge_base()' -m "megamerge"
fi

# Keep default@ as an empty integration working copy on top of the megamerge
jj new 'megamerge()'

if [ -n "$(jj log -r 'megamerge() & conflicts()' --no-graph -T 'commit_id')" ]; then
  echo "Megamerge has conflicts. Fix the files in this workspace, then run: jj squash"
fi
''']

# Show which agent workspaces are active vs idle, and report merge conflicts.
mega-status = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj workspace update-stale >/dev/null 2>&1 || true
echo "=== Active Agent Workspaces ==="
jj log -r 'active_agents()' --no-graph -T 'working_copies ++ "  " ++ change_id.short() ++ "  " ++ description.first_line() ++ "\n"'
echo ""
echo "=== Idle Agent Workspaces (empty on the base) ==="
jj log -r 'idle_agents()' --no-graph -T 'working_copies ++ "  " ++ change_id.short() ++ "\n"'
echo ""
echo "=== Megamerge ==="
if [ -z "$(jj log -r 'megamerge()' --no-graph -T 'commit_id')" ]; then
  echo "No megamerge commit yet. Run: jj mega-sync"
else
  jj log -r 'agents_of_megamerge()' --no-graph -T 'if(conflict, "!! CONFLICT: ", "   ") ++ change_id.short() ++ "  " ++ description.first_line() ++ "\n"'
fi
''']

# Forget idle workspaces (empty commits on the base) and workspaces whose
# directories no longer exist on disk.
mega-prune = ["util", "exec", "--", "bash", "-c", '''
set -euo pipefail
jj workspace update-stale >/dev/null 2>&1 || true

# Forget any workspace whose working copy is an empty commit directly on the base
jj log -r 'idle_agents()' --no-graph -T 'working_copies ++ "\n"' | tr ' ,@' '\n\n\n' | while read -r ws; do
  if [ -n "$ws" ] && [ "$ws" != "default" ]; then
    echo "Forgetting idle workspace: $ws"
    jj workspace forget "$ws"
  fi
done

# Also forget any workspace whose root directory no longer exists on disk
jj workspace list -T 'name ++ "\t" ++ root ++ "\n"' | while IFS=$'\t' read -r name root; do
  if [ "$name" != "default" ] && [ ! -d "$root" ]; then
    echo "Forgetting missing-directory workspace: $name ($root)"
    jj workspace forget "$name"
  fi
done
''']

[[--scope]]
--when.hostnames = ["nixos-vm"]
[--scope.signing]
key = "~/.ssh/id_vm_ed25519.pub"
